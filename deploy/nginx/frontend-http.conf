map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $remote_addr $bunnyland_forwarded_proto {
    default $scheme;
}

limit_req_zone $binary_remote_addr zone=bunnyland_api:10m rate=${BUNNYLAND_EDGE_API_RATE};
limit_conn_zone $binary_remote_addr zone=bunnyland_api_conn:10m;

server {
    listen 80;
    server_name ${BUNNYLAND_SERVER_NAME};

    include /etc/nginx/conf.d/security-headers.inc;

    root /usr/share/nginx/html;
    index index.html;

    location = /config.json {
        alias /usr/share/nginx/config/config.json;
        default_type application/json;
        # This location's own add_header replaces the server block's, so restate them.
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/conf.d/api-locations.inc;
}
