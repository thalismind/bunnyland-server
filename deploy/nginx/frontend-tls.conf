map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $bunnyland_cache_control {
    /config.json "no-store";
    ~^/(?:[^/]+/)*assets/.*-[A-Za-z0-9_-]{8,}\.[^/]+$ "public, max-age=31536000, immutable";
    default "no-cache";
}

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types application/javascript application/json image/svg+xml text/css text/plain;

map $remote_addr $bunnyland_forwarded_proto {
    default $scheme;
}

limit_req_zone $binary_remote_addr zone=bunnyland_api:10m rate=${BUNNYLAND_EDGE_API_RATE};
limit_conn_zone $binary_remote_addr zone=bunnyland_api_conn:10m;

server {
    listen 80;
    server_name ${BUNNYLAND_SERVER_NAME};

    include /etc/nginx/conf.d/security-headers.inc;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${BUNNYLAND_SERVER_NAME};

    include /etc/nginx/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $bunnyland_cache_control always;

    ssl_certificate /etc/letsencrypt/live/${BUNNYLAND_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${BUNNYLAND_CERT_NAME}/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location = /config.json {
        alias /usr/share/nginx/config/config.json;
        default_type application/json;
        # This location's own add_header replaces the server block's, so restate them.
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/conf.d/api-locations.inc;
}
