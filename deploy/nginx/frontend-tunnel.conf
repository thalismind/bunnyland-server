map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $bunnyland_cache_control {
    /config.json "no-store";
    ~^/(?:[^/]+/)*assets/.*-[A-Za-z0-9_-]{8,}\.[^/]+$ "public, max-age=31536000, immutable";
    default "no-cache";
}

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types application/javascript application/json image/svg+xml text/css text/plain;

map $realip_remote_addr $bunnyland_forwarded_proto {
    default $scheme;
    ${BUNNYLAND_CLOUDFLARED_IP} https;
}

set_real_ip_from ${BUNNYLAND_CLOUDFLARED_IP};
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

limit_req_zone $binary_remote_addr zone=bunnyland_api:10m rate=${BUNNYLAND_EDGE_API_RATE};
limit_conn_zone $binary_remote_addr zone=bunnyland_api_conn:10m;

server {
    listen 8080 default_server;
    server_name _;
    return 421;
}

server {
    listen 8080;
    server_name ${BUNNYLAND_HOME_NAME};

    root /usr/share/nginx/home;
    index index.html;

    include /etc/nginx/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $bunnyland_cache_control always;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /tempo {
        return 404;
    }

    location ^~ /tempo/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8080;
    server_name ${BUNNYLAND_SERVER_NAME};

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.inc;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $bunnyland_cache_control always;

    location = /config.json {
        alias /tmp/bunnyland-config.json;
        default_type application/json;
    }

    location = /tempo {
        return 404;
    }

    location ^~ /tempo/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/conf.d/api-locations.inc;
}
