map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $bunnyland_cache_control {
    /config.json "no-store";
    default "";
}

map $realip_remote_addr $bunnyland_forwarded_proto {
    default $scheme;
    ${BUNNYLAND_CLOUDFLARED_IP} https;
}

set_real_ip_from ${BUNNYLAND_CLOUDFLARED_IP};
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

limit_req_zone $binary_remote_addr zone=bunnyland_api:10m rate=${BUNNYLAND_EDGE_API_RATE};

server {
    listen 8080 default_server;
    server_name _;
    return 421;
}

server {
    listen 8080;
    server_name ${BUNNYLAND_HOME_NAME};

    root /usr/share/nginx/home;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /tempo {
        return 404;
    }

    location ^~ /tempo/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 8080;
    server_name ${BUNNYLAND_SERVER_NAME};

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $bunnyland_cache_control always;

    location = /config.json {
        alias /tmp/bunnyland-config.json;
        default_type application/json;
    }

    location = /tempo {
        return 404;
    }

    location ^~ /tempo/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/conf.d/api-locations.inc;
}
