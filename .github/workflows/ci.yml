name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: classify
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$BEFORE_SHA"
          else
            base="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
          fi

          docs_only=true
          while IFS= read -r path; do
            case "$path" in
              docs/*|*.md|scripts/check-doc-links.py|tests/test_doc_links.py)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation links
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate documentation links
        run: python3 scripts/check-doc-links.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Audit installed dependencies
        if: matrix.python-version == '3.12'
        run: |
          uv export --frozen --all-extras --no-dev --no-emit-project \
            --format requirements-txt --output-file "${RUNNER_TEMP}/requirements.locked.txt"
          uv run --with pip-audit pip-audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --requirement "${RUNNER_TEMP}/requirements.locked.txt"

      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run ruff check src tests

      - name: Test with coverage
        env:
          BUNNYLAND_PLAYTEST_TRACE_DIR: artifacts/playtests
        run: scripts/test-all

      - name: Check bounded world operations across CI-sized worlds
        if: matrix.python-version == '3.12'
        run: scripts/test-performance

      - name: Publish test and coverage summary
        if: always()
        run: python3 scripts/ci_report.py

      - name: Upload playtest traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discord-playtest-traces-python-${{ matrix.python-version }}
          path: artifacts/playtests
          if-no-files-found: error

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-python-${{ matrix.python-version }}
          path: |
            artifacts/coverage/pytest.xml
            coverage.xml
          if-no-files-found: error

      - name: Upload performance smoke report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: performance-smoke
          path: artifacts/performance/smoke
          if-no-files-found: error

  package:
    name: Build and validate Python distributions
    runs-on: ubuntu-latest
    needs: test
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build wheel and source distribution
        run: uv build --wheel --sdist --out-dir dist

      - name: Validate distribution metadata
        run: uvx twine check dist/*.whl dist/*.tar.gz

      - name: Smoke test the installed wheel
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          uv venv "${{ runner.temp }}/wheel-smoke"
          uv pip install --python "${{ runner.temp }}/wheel-smoke/bin/python" \
            "${wheel}[chroma,discord,imagegen,llm,mcp,otel,repl,server,tui]"
          "${{ runner.temp }}/wheel-smoke/bin/python" -c \
            'from importlib.metadata import version; from importlib.resources import files; import bunnyland; from bunnyland.plugins import discover_plugins; assert bunnyland.__version__ == version("bunnyland"); assert files("bunnyland").joinpath("py.typed").is_file(); assert discover_plugins()'
          "${{ runner.temp }}/wheel-smoke/bin/bunnyland" --help
          "${{ runner.temp }}/wheel-smoke/bin/bunnyland" tui --help
          "${{ runner.temp }}/wheel-smoke/bin/bunnyland" repl --help
          "${{ runner.temp }}/wheel-smoke/bin/python" scripts/verify-migration-corpus.py

      - name: Smoke test the installed source distribution
        run: |
          sdist="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          uv venv "${{ runner.temp }}/sdist-smoke"
          uv pip install --python "${{ runner.temp }}/sdist-smoke/bin/python" "$sdist"
          "${{ runner.temp }}/sdist-smoke/bin/python" -c \
            'from importlib.metadata import version; import bunnyland; assert bunnyland.__version__ == version("bunnyland")'
          "${{ runner.temp }}/sdist-smoke/bin/bunnyland" --help
          "${{ runner.temp }}/sdist-smoke/bin/python" scripts/verify-migration-corpus.py

      - name: Generate reproducible CycloneDX SBOM
        run: |
          uvx --from cyclonedx-bom cyclonedx-py environment \
            "${{ runner.temp }}/wheel-smoke" \
            --output-format JSON \
            --output-file dist/bunnyland.cdx.json \
            --output-reproducible
          serial="urn:uuid:${GITHUB_SHA:0:8}-${GITHUB_SHA:8:4}-5${GITHUB_SHA:13:3}-8${GITHUB_SHA:17:3}-${GITHUB_SHA:20:12}"
          jq --arg serial "$serial" \
            '.serialNumber = $serial' \
            dist/bunnyland.cdx.json > dist/bunnyland.cdx.tmp.json
          mv dist/bunnyland.cdx.tmp.json dist/bunnyland.cdx.json

      - name: Record distribution hashes
        run: |
          cd dist
          sha256sum *.whl *.tar.gz bunnyland.cdx.json > SHA256SUMS
          test -s SHA256SUMS

      - name: Attest distribution provenance
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Attest wheel SBOM
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: dist/*.whl
          sbom-path: dist/bunnyland.cdx.json

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  artifact-compatibility:
    name: Installed artifact on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download exact workflow distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions-${{ github.sha }}
          path: dist

      - name: Verify installed wheel and compatibility surface
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv "${{ runner.temp }}/artifact-smoke"
          uv pip install --python "${{ runner.temp }}/artifact-smoke/bin/python" \
            "${wheel}[chroma,discord,imagegen,llm,mcp,otel,repl,server,tui]"
          expected="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          EXPECTED_VERSION="$expected" "${{ runner.temp }}/artifact-smoke/bin/python" -c \
            'import os; from importlib.metadata import metadata, version; from importlib.resources import files; import bunnyland; from bunnyland.plugins import discover_plugins; package = metadata("bunnyland"); assert bunnyland.__version__ == version("bunnyland") == os.environ["EXPECTED_VERSION"]; assert "relics-ecs<0.2,>=0.1.1" in package.get_all("Requires-Dist", []); assert files("bunnyland").joinpath("py.typed").is_file(); assert discover_plugins()'
          "${{ runner.temp }}/artifact-smoke/bin/bunnyland" --help
          "${{ runner.temp }}/artifact-smoke/bin/bunnyland" tui --help
          "${{ runner.temp }}/artifact-smoke/bin/bunnyland" repl --help
          "${{ runner.temp }}/artifact-smoke/bin/python" scripts/verify-migration-corpus.py

  publish-pypi:
    name: Publish signed release to PyPI
    runs-on: ubuntu-latest
    needs:
      - package
      - artifact-compatibility
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out signed release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify annotated tag signature and package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          test "$object_type" = "tag"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" --jq '.verification.verified')"
          test "$verified" = "true"
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${package_version}"

      - name: Download exact validated distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions-${{ github.sha }}
          path: dist

      - name: Verify distribution hashes
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Select publishable distributions
        run: |
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/

      - name: Publish with Trusted Publishing and PyPI attestations
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: publish/
          attestations: true

  container:
    name: Build container
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.server-build.outputs.digest }}
    needs:
      - changes
      - docs
      - test
      - package
      - artifact-compatibility
      - security
      - image-security
    if: needs.changes.outputs.docs-only != 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: server-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bunnyland-server
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish Bunnyland container
        id: server-build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BUNNYLAND_GIT_HASH=${{ github.sha }}
          no-cache: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.server-meta.outputs.tags }}
          labels: ${{ steps.server-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=bunnyland-server
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/bunnyland-server:buildcache
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/bunnyland-server:main
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/bunnyland-server:latest
          cache-to: |
            type=gha,scope=bunnyland-server,mode=max
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/bunnyland-server:buildcache,mode=max,ignore-error=true

  security:
    name: Repository security
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject expired or overdue scanner exceptions
        run: scripts/check-security-exceptions

      - name: Scan full history for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  image-security:
    name: Image security
    runs-on: ubuntu-latest
    needs:
      - changes
      - test
    if: needs.changes.outputs.docs-only != 'true'
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build exact image under test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: bunnyland-server:security-${{ github.sha }}
          build-args: BUNNYLAND_GIT_HASH=${{ github.sha }}

      - name: Generate image CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: bunnyland-server:security-${{ github.sha }}
          format: cyclonedx-json
          output-file: bunnyland-server.cdx.json
          upload-artifact: false

      - name: Scan exact image with Grype
        uses: anchore/scan-action@v7.4.0
        with:
          image: bunnyland-server:security-${{ github.sha }}
          output-format: json
          output-file: bunnyland-server.grype.json
          fail-build: false
          only-fixed: false
          severity-cutoff: high
          by-cve: true
          config: .grype.yaml

      - name: Fail on actionable high or critical image findings
        run: scripts/check-grype-findings bunnyland-server.grype.json

      - name: Upload image security evidence
        uses: actions/upload-artifact@v7
        with:
          name: bunnyland-server-image-security-${{ github.sha }}
          path: |
            bunnyland-server.cdx.json
            bunnyland-server.grype.json
          if-no-files-found: error

  vps-setup:
    name: VPS Docker setup smoke test
    runs-on: ubuntu-latest
    needs:
      - container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Docker availability
        run: |
          docker version
          docker compose version
          sudo docker version
          sudo docker compose version

      - name: Run exact-container auth smoke
        env:
          BUNNYLAND_CONTAINER_RUNTIME: docker
          BUNNYLAND_SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/bunnyland-server@${{ needs.container.outputs.digest }}
        run: |
          sudo --preserve-env=BUNNYLAND_CONTAINER_RUNTIME,BUNNYLAND_SERVER_IMAGE \
            scripts/container-auth-smoke

  dispatch-3d-promotion:
    name: Request 3D server-base promotion
    runs-on: ubuntu-latest
    needs:
      - container
      - vps-setup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Dispatch immutable server image to 3D
        env:
          GH_TOKEN: ${{ secrets.BUNNYLAND_3D_PROMOTION_TOKEN }}
          SERVER_DIGEST: ${{ needs.container.outputs.digest }}
        run: |
          test -n "$GH_TOKEN"
          [[ "$SERVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n \
            --arg source_repo "$GITHUB_REPOSITORY" \
            --arg source_ref "$GITHUB_REF" \
            --arg source_sha "$GITHUB_SHA" \
            --arg digest "$SERVER_DIGEST" \
            '{
              event_type: "promote-server",
              client_payload: {
                source_repo: $source_repo,
                source_ref: $source_ref,
                source_sha: $source_sha,
                digest: $digest
              }
            }' |
            gh api --method POST repos/thalismind/bunnyland-3d/dispatches --input -
