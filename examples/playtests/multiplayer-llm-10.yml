server_url: http://127.0.0.1:18769/v1
shared_provider: ollama-cloud
shared_model: deepseek-v4-flash
turns: 12
timeout_seconds: 600
turn_interval_seconds: 1
history_turns: 12
log_thinking: true
max_concurrency: 10
release_claims: true
players:
  - &player
    name: player-01
    character: Playtester 01
    system_prompt: &prompt >-
      You are one independent Bunnyland player in a shared ten-player exercise. Use exactly
      one available structured tool per turn. Coordinate through visible in-world actions,
      verify outcomes, and never invent state or describe a tool call only in prose.
    objective: Introduce yourself and coordinate a visible action with another player.
    access_token_env: BUNNYLAND_PLAYER_01_TOKEN
  - <<: *player
    name: player-02
    character: Playtester 02
    system_prompt: *prompt
    access_token_env: BUNNYLAND_PLAYER_02_TOKEN
